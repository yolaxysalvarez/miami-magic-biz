<script>
/* Manda a cada teléfono a su tienda, sin pasos intermedios */
(function(){
  var IOS='https://apps.apple.com/app/id6808848681';
  var PLAY='https://play.google.com/store/apps/details?id=com.yyentertainment.miamimagic';
  var ua=navigator.userAgent||'';
  var isIOS=/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints>1);
  var isAndroid=/Android/i.test(ua);
  if(isIOS){ location.replace(IOS); }
  else if(isAndroid){ location.replace(PLAY); }
})();
</script>
